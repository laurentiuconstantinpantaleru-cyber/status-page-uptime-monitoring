services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    env_file: .env
    # Every session starts in UTC (D-020).
    command: --default-time-zone=+00:00
    ports:
      # Host 3307: 3306 is often taken by a locally installed MySQL.
      # Bound to 127.0.0.1 so the database is not reachable from the network.
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # TCP ping: the temporary init server runs without networking, so this stays
      # unhealthy until the real server is up. A ping needs no credentials.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
