<script>
/* Theme toggle (D-024): switches light and dark and remembers the choice. */
(function () {
  var root = document.documentElement, btn = document.getElementById('theme-btn');
  var dark = window.matchMedia('(prefers-color-scheme: dark)');
  function label() { btn.setAttribute('aria-label', root.dataset.effective === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'); }
  btn.addEventListener('click', function () {
    var next = root.dataset.effective === 'dark' ? 'light' : 'dark';
    localStorage.setItem('theme', next);
    root.dataset.theme = next;
    root.dataset.effective = next;
    label();
  });
  dark.addEventListener('change', function () {
    if (root.dataset.theme) return;
    root.dataset.effective = dark.matches ? 'dark' : 'light';
    label();
  });
  label();
})();
</script>
