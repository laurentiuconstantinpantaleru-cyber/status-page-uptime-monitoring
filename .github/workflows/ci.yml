name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Knowledge Ledger Lint
        run: |
          python3 docs/agents/tools/ledger-lint.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
        continue-on-error: true

      - name: Install dependencies and run tests
        run: |
          if [ -f package.json ]; then
            npm install
            npm test
          else
            echo "package.json not yet created. Skipping npm test."
          fi
